name: native artifact trial

on: pull_request

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  artifacts:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      PREPARE_LOCKS: "0"
      npm_config_allow_remote: all
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-26.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-26.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned builder tools
        run: |
          export TMPDIR="$PWD/.work/tmp"
          mkdir -p "$TMPDIR/loader"
          loader=ld-musl-$(uname -m).so.1
          docker run --rm -v "$TMPDIR/loader:/out" alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 cp "/lib/$loader" /out/
          sudo install -m 755 "$TMPDIR/loader/$loader" "/lib/$loader"
          sh tools/toolchain.sh "$TARGET" > "$TMPDIR/toolchain.out"
          printf '%s\n' "$(awk 'NR==1 {print}' "$TMPDIR/toolchain.out")" >> "$GITHUB_PATH"
          printf 'PYTHON=%s\n' "$(awk 'NR==2 {print}' "$TMPDIR/toolchain.out")" >> "$GITHUB_ENV"
      - name: Check the case-sensitive Intercom manifest path
        run: |
          export TMPDIR="$PWD/.work/tmp"
          sealed="$TMPDIR/intercom-case"
          mkdir -p "$sealed/tools" "$sealed/tests" "$sealed/.work/tmp"
          cp tools/intercom.py tools/vendor.py "$sealed/tools/"
          cp tests/intercom_overlay_test.py "$sealed/tests/"
          cd "$sealed"
          "$PYTHON" -m unittest discover -s tests -p intercom_overlay_test.py -k test_prepare_materializes_only_verified_snapshot_files
          "$PYTHON" - <<'PY'
          from pathlib import Path

          p = Path("tools/intercom.py")
          s = p.read_text()
          old = "sources/upstreams.json"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "SOURCES/UPSTREAMS.JSON"))
          PY
          if PYTHONPYCACHEPREFIX="$sealed/.work/case-bytecode" "$PYTHON" -m unittest discover -s tests -p intercom_overlay_test.py -k test_prepare_materializes_only_verified_snapshot_files > "$TMPDIR/case-control.log" 2>&1; then
            exit 1
          fi
          "$PYTHON" - "$TMPDIR/case-control.log" <<'PY'
          import sys
          from pathlib import Path

          log = Path(sys.argv[1]).read_text()
          assert "FileNotFoundError" in log and "SOURCES/UPSTREAMS.JSON" in log, log
          print("uppercase manifest fault rejected")
          PY
      - name: Build and verify both native artifact profiles
        run: |
          export TMPDIR="$PWD/.work/tmp"
          make test-intercom PYTHON="$PYTHON"
          for profile in headless-usr full; do
            make repro verify TARGET="$TARGET" PROFILE="$profile" PYTHON="$PYTHON"
            manifest="dist/$profile/pi-$profile-1.5.0-$TARGET.manifest.json"
            jaq -c '{target,profile,sha256,bytes,source_revision}' "$manifest"
          done
          git diff --exit-code -- locks sources patches
      - name: Check both packaged SDK loaders under musl
        run: |
          export TMPDIR="$PWD/.work/tmp"
          bin=$(sh tools/toolchain.sh "$TARGET" musl)
          for profile in headless-usr full; do
            stem="dist/$profile/pi-$profile-1.5.0-$TARGET"
            "$PYTHON" -I tools/archive.py verify "$stem.tar.xz" "$stem.manifest.json" "$TARGET" "$profile" >/dev/null
            destination=".work/musl/$profile"
            mkdir -p "$destination"
            "$PYTHON" -I tools/archive.py unpack "$stem.tar.xz" "$destination"
            docker run --rm -e "NODE_BIN=/w${bin#"$PWD"}" -e "ARTIFACT_ROOT=/w/$destination" -v "$PWD:/w" -w /w alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 sh -euc '
              apk add --no-cache libstdc++ >/dev/null
              export PATH="$NODE_BIN:$PATH" TMPDIR=/w/.work/tmp
              case "$(ldd "$NODE_BIN/node" 2>&1)" in *musl*) ;; *) exit 1 ;; esac
              node "$ARTIFACT_ROOT/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" --version
              node tools/verify.mjs "$ARTIFACT_ROOT"
            '
          done
