[project]
name = "pi-build"
version = "0.1.0"
description = "Deterministic, locked Pi runtime archives built from preserved source snapshots"
requires-python = ">=3.15"
dependencies = []

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = false

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "ty==0.0.101",
    "uv==0.13.7",
]

[tool.ruff]
target-version = "py315"

[tool.ty.environment]
python-version = "3.15"

[[tool.uv.index]]
url = "https://pypi.17166969.xyz/current/simple/"
default = true
