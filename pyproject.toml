[project]
name = "pi-build"
version = "0.1.0"
description = "Deterministic, locked Pi runtime archives built from preserved source snapshots"
requires-python = ">=3.15"
dependencies = ["laputa-buildlib==0.3.1"]

[tool.pytest.ini_options]
python_files = ["*_test.py", "test_*.py"]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = false

[dependency-groups]
dev = [
    "coverage==7.17.3",
    "mutmut==3.8.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "ty==0.0.101",
    "uv==0.13.7",
]

[tool.coverage.run]
source = ["tools"]
branch = true
parallel = true
patch = ["subprocess"]
data_file = ".work/tmp/coverage/.coverage"

[tool.ruff]
target-version = "py315"

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
missing-type-argument = "error"

[[tool.uv.index]]
url = "https://pypi.17166969.xyz/current/simple/"
default = true
